# Streamlit settings for the hedging advisor. Colours live here, not in CSS. The app follows the visitor's
# system light/dark setting; the app menu (Settings) switches between the two.
[theme]
baseRadius = "medium"

[theme.dark]
primaryColor = "#1f6feb"               # buttons, sliders: blue dark enough for white button text
linkColor = "#4da3ff"
backgroundColor = "#050b1a"            # black and deep blue
secondaryBackgroundColor = "#0f1c33"   # sidebar, inputs, cards
textColor = "#e6eefc"
borderColor = "#22365c"
chartCategoricalColors = ["#4da3ff", "#f0b429", "#3fb950", "#db61a2", "#a371f7", "#8b949e"]

[theme.light]
primaryColor = "#1f6feb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f6fb"
textColor = "#0b1a33"
borderColor = "#d0d9e8"
chartCategoricalColors = ["#1f6feb", "#bf8700", "#1a7f37", "#bf3989", "#8250df", "#57606a"]

[browser]
gatherUsageStats = false
